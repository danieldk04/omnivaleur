<!doctype html>
<html><head><meta charset="utf-8"><title>motion3d</title>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<style>
@font-face{font-family:'Montserrat';src:url('node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2');font-weight:800}
@font-face{font-family:'Montserrat';src:url('node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2');font-weight:900}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;font-family:'Montserrat',sans-serif}
#gl{position:absolute;left:0;top:0;width:720px;height:1280px}
#cap{position:absolute;left:20px;right:20px;top:800px;height:180px;display:flex;align-items:center;justify-content:center;text-align:center;transform-origin:50% 50%}
#cap span{display:block}
.blocky #cap{font:900 74px/1.04 'Montserrat';color:#fff;text-transform:uppercase;-webkit-text-stroke:11px rgba(10,10,20,.92);paint-order:stroke fill;letter-spacing:-1px}
.blocky #cap b{color:#ffd23f}
.toon #cap{top:1010px;font:italic 400 50px/1.15 Georgia,'Times New Roman',serif;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.65)}
.toon #cap b{font-weight:400;color:#ff7a3d}
.real #cap{top:880px;font:900 62px/1.05 'Montserrat';color:#fff;-webkit-text-stroke:9px rgba(0,0,0,.85);paint-order:stroke fill}
.real #cap b{color:#ffd23f}
#cctv{position:absolute;inset:0;pointer-events:none;display:none;font:700 28px 'Courier New',monospace;color:#fff}
#cctv .rec{position:absolute;right:30px;top:36px;color:#ff3b30}
#cctv .ts{position:absolute;left:30px;top:36px}
#cctv .cam{position:absolute;left:30px;bottom:60px}
#cctv:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.38) 100%)}
#end{position:absolute;inset:0;pointer-events:none;display:none}
#end .mk{position:absolute;left:50%;top:150px;width:460px;margin-left:-230px;display:flex;align-items:center;gap:14px;justify-content:center;background:#fff;padding:14px 30px;border-radius:999px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#end .mk img{width:92px}#end .mk span{font:900 42px Montserrat;color:#0a1936;letter-spacing:-1px}
#end .cta{position:absolute;left:50%;top:290px;transform:translateX(-50%);padding:22px 44px;border-radius:999px;background:#85edbc;color:#0a1936;font:900 46px/1 Montserrat;box-shadow:0 14px 40px rgba(0,0,0,.4);white-space:nowrap}
#end .url{position:absolute;left:50%;top:386px;transform:translateX(-50%);font:900 34px Montserrat;color:#fff;-webkit-text-stroke:8px rgba(10,20,50,.9);paint-order:stroke fill}
#end .share{position:absolute;left:50%;top:446px;transform:translateX(-50%);background:#ffd23f;color:#0a1936;padding:12px 26px;border-radius:999px;font:900 28px Montserrat;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#end>*{transform-origin:50% 50%}
</style></head>
<body><div id="stage"><canvas id="gl" width="720" height="1280"></canvas><div id="cctv"><div class="ts">11/20 03:14 AM</div><div class="rec">● REC</div><div class="cam">CAM 01 · FRONT DOOR</div></div><div id="vig"></div><div id="cap"></div>
<div id="end"><div class="mk"><img src="assets/mark.png"><span>Omnivaleur</span></div><div class="cta">7 days free</div><div class="url">omnivaleur.com</div><div class="share">Send this to a seller</div></div></div>
<script>if(new URLSearchParams(location.search).get("lang")==="nl"){const q=x=>document.querySelector(x);q("#end .cta").textContent="7 dagen gratis";q("#end .url").textContent="omnivaleur.com/nl";q("#end .share").textContent="Stuur dit naar een verkoper";q("#cctv .cam").textContent="CAM 01 · VOORDEUR";}</script>
<script type="module" src="./motion3d/engine.js"></script></body></html>
