<!doctype html>
<meta charset="utf-8">
<title>Omnivaleur</title>
<!--
  Het anker-tabblad van het werkvenster.

  Dit tabblad doet niets; het bestaat om twee redenen:

  1. Zonder een tabblad verdwijnt het venster zodra de laatste opdracht klaar is,
     en dan popt er bij de volgende opdracht weer een nieuw venster op.
  2. Het is het herkenningsteken van het werkvenster. De extensie kan zo altijd
     terugvinden welk venster van haar is — ook nadat de extensie is bijgewerkt
     of opnieuw gestart. Voorheen was dat een simpele lege pagina en raakte ze na
     elke update het spoor kwijt: dan bleef het oude venster staan en kwam er een
     nieuwe bij, keer op keer.
-->
<style>
  @font-face { font-family: "Hanken Grotesk"; src: url("fonts/hanken-grotesk-var.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; background: #0649c7; color: #fff; font: 15px/1.45 "Hanken Grotesk", sans-serif; text-align: center; }
  img { width: 74px; height: 40px; margin-bottom: 10px; }
</style>
<body>
  <img src="mark.png" alt="">
  <div lang="en">Omnivaleur is working in the background. You can leave this window minimised.</div>
  <div lang="nl">Omnivaleur werkt op de achtergrond. Je kunt dit venster geminimaliseerd laten.</div>
</body>
