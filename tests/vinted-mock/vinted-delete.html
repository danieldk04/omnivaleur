<!doctype html>
<meta charset="utf-8">
<title>Vinted delete-flow replica — Omnivaleur test harness</title>
<!--
  WAAROM DEZE PAGINA BESTAAT (30-08-2026)

  Bij één verkoper mislukten acht Vinted-verversingen op rij met "still in your
  wardrobe after confirming delete", terwijl haar advertenties aantoonbaar nog
  online stonden. Er was dus echt niets weggehaald.

  De knopteksten hieronder zijn geen gok: ze komen uit Vinted's eigen
  tekstenboek, dat in elke artikelpagina wordt meegestuurd. Opgehaald op
  30-08-2026 van vinted.nl, .be, .fr, .de en .com:

    item.actions.delete                   nl "Verwijderen"  fr "Supprimer"  de "Löschen"  en "Delete"
    item.deletion_modal.actions.delete    nl "Bevestigen en verwijderen"    fr "Confirmer et supprimer"
    item.deletion_modal.actions.delete_v2 nl "Ja, verwijderen"              fr "Supprimer"   de "Löschen"
    item.deletion_modal.actions.cancel    nl "Annuleren"                    fr "Annuler"     de "Abbrechen"

  Let op de Franse en Duitse tweede variant: de bevestigknop in het venster heet
  daar LETTERLIJK hetzelfde als de knop op de pagina. Wie in de hele pagina naar
  "Supprimer" zoekt en de eerste pakt, klikt dus gegarandeerd de verkeerde aan —
  het venster gaat open en weer dicht en er gebeurt niets.

  Deze pagina draait de ECHTE routine uit extension/background.js (via build.js
  eruit gesneden) tegen een namaakscherm, en controleert per land dat er in het
  VENSTER wordt geklikt en niet op de pagina.
-->
<style>
  body { font: 14px/1.6 system-ui; margin: 0; padding: 24px 32px; }
  .venster { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex;
             align-items: center; justify-content: center; }
  .venster .doos { background: #fff; padding: 24px; border-radius: 10px; min-width: 320px; }
  #uitslag { font: 13px/1.6 ui-monospace, monospace; white-space: pre; background: #f6f8fa;
             padding: 14px; border-radius: 6px; margin-top: 18px; }
  .goed { color: #0a7c2f } .fout { color: #c02626; font-weight: 700 }
</style>

<h2>Replica van het Vinted-scherm "advertentie verwijderen"</h2>
<div id="pagina"></div>
<div id="uitslag">bezig…</div>

<script src="mw-functions.js"></script>
<script>
// Elk geval: de tekst op de pagina, de tekst in het venster, en hoe het venster
// herkenbaar is. Precies de varianten die Vinted zelf uitserveert.
const GEVALLEN = [
  { naam: "vinted.nl — variant 1", knop: "Verwijderen", bevestig: "Bevestigen en verwijderen", annuleer: "Annuleren", rol: true },
  { naam: "vinted.nl — variant 2", knop: "Verwijderen", bevestig: "Ja, verwijderen",           annuleer: "Annuleren", rol: true },
  { naam: "vinted.fr — zelfde tekst!", knop: "Supprimer", bevestig: "Supprimer",               annuleer: "Annuler",   rol: true },
  { naam: "vinted.de — zelfde tekst!", knop: "Löschen",   bevestig: "Löschen",                 annuleer: "Abbrechen", rol: true },
  { naam: "vinted.com",                knop: "Delete",    bevestig: "Confirm and delete",      annuleer: "Cancel",    rol: true },
  { naam: "venster zonder role=dialog", knop: "Verwijderen", bevestig: "Ja, verwijderen",      annuleer: "Annuleren", rol: false,
    titel: "Advertentie verwijderen?" },
  { naam: "knop achter het menu",      knop: "Verwijderen", bevestig: "Ja, verwijderen",       annuleer: "Annuleren", rol: true,
    kebab: true },
  // PRECIES WAT ER BIJ DE VERKOPER GEBEURDE. De knop op de pagina draagt een
  // data-testid met "delete", dus de oude code vond hem wél — maar het venster
  // is niet als role="dialog" herkenbaar. De bevestiging werd dan in de hele
  // pagina gezocht, en dat is opnieuw de knop op de pagina zelf: venster open,
  // venster dicht, niets verwijderd. En daarna terecht: "still in your wardrobe".
  { naam: "haar geval: testid + geen rol", knop: "Verwijderen", bevestig: "Ja, verwijderen",
    annuleer: "Annuleren", rol: false, testid: "item-delete-button" },
  // WAT ER OP 10-09-2026 GEBEURDE, op het account dkresellacademy.
  //
  // Het venster "Confirm and delete" stond gewoon op het scherm en er werd niet
  // op geklikt. Oorzaak, gemeten op de echte pagina van advertentie 9419472843:
  // het cookiescherm van OneTrust hangt als 179e blok in de body en draagt
  // role="dialog" én aria-modal="true". Het echte verwijdervenster wordt er PAS
  // DAARNA onderaan bij gehangen. "Het eerste venster op de pagina" is dus
  // altijd het cookiescherm, en daar staat geen bevestigknop in. Bij wie de
  // cookies al heeft weggeklikt staat dat blok er nog steeds, onzichtbaar —
  // vandaar dat ook de foutmelding geen enkele knop kon opnoemen.
  { naam: "cookiescherm weggeklikt (dkresellacademy)", knop: "Confirm-vest", bevestig: "Confirm and delete",
    annuleer: "Cancel", rol: true, testid: "item-delete-button", bevestigTestid: "item-delete-confirmation-button",
    annuleerTestid: "item-delete-cancelation-button", cookies: "verborgen" },
  { naam: "cookiebanner nog zichtbaar", knop: "Verwijderen", bevestig: "Bevestigen en verwijderen",
    annuleer: "Annuleren", rol: true, cookies: "zichtbaar" },
];

function bouw(geval) {
  document.querySelectorAll(".venster").forEach(v => v.remove());
  document.querySelectorAll("#onetrust-consent-sdk").forEach(v => v.remove());
  const p = document.getElementById("pagina");
  p.innerHTML = "";

  // Het cookiescherm zoals het echt op vinted.nl staat: een eigen blok in de
  // body met role="dialog" en aria-modal="true", VOOR het verwijdervenster.
  if (geval.cookies) {
    const sdk = document.createElement("div");
    sdk.id = "onetrust-consent-sdk";
    const laag = document.createElement("div");
    laag.setAttribute("role", "dialog");
    laag.setAttribute("aria-modal", "true");
    if (geval.cookies === "verborgen") laag.style.display = "none";
    for (const label of ["Alle toestaan", "Alleen essentiële cookies", "Cookies beheren"]) {
      const b = document.createElement("button");
      b.textContent = label;
      laag.appendChild(b);
    }
    sdk.appendChild(laag);
    document.body.insertBefore(sdk, document.body.firstChild);
  }
  const telling = { pagina: 0, bevestig: 0, annuleer: 0 };

  const paginaKnop = document.createElement("button");
  paginaKnop.textContent = geval.knop;
  if (geval.testid) paginaKnop.setAttribute("data-testid", geval.testid);
  // Twee keer klikken op de knop van de pagina zet het venster open en weer
  // dicht — net als bij Vinted. Dát is wat er misging.
  paginaKnop.onclick = () => {
    telling.pagina++;
    const open = document.querySelector(".venster");
    if (open) open.remove(); else opuit();
  };

  if (geval.kebab) {
    const menu = document.createElement("button");
    menu.setAttribute("data-testid", "item-actions-button");
    menu.textContent = "···";
    const lade = document.createElement("div");
    lade.setAttribute("role", "menu");
    lade.style.display = "none";
    lade.appendChild(paginaKnop);
    menu.onclick = () => { lade.style.display = "block"; };
    p.append(menu, lade);
  } else {
    p.append(document.createTextNode("Favoriet  "), paginaKnop);
  }

  function opuit() {
    // Het venster wordt — net als bij Vinted — ONDERAAN de body gehangen.
    const laag = document.createElement("div");
    laag.className = "venster";
    if (geval.rol) laag.setAttribute("role", "dialog");
    const doos = document.createElement("div");
    doos.className = "doos";
    if (geval.titel) { const h = document.createElement("h3"); h.textContent = geval.titel; doos.appendChild(h); }
    const ja = document.createElement("button");
    ja.textContent = geval.bevestig;
    if (geval.bevestigTestid) ja.setAttribute("data-testid", geval.bevestigTestid);
    ja.onclick = () => { telling.bevestig++; laag.remove(); };
    const nee = document.createElement("button");
    nee.textContent = geval.annuleer;
    if (geval.annuleerTestid) nee.setAttribute("data-testid", geval.annuleerTestid);
    nee.onclick = () => { telling.annuleer++; laag.remove(); };
    doos.append(nee, ja);          // annuleren staat als eerste, net als bij Vinted
    laag.appendChild(doos);
    document.body.appendChild(laag);
  }
  return telling;
}

// DE CODE VAN VÓÓR 30-08-2026, letterlijk. Staat hier als TEGENPROEF: zonder
// dit is niet te zien dát deze pagina iets aantoont. Hij hoort te falen op elk
// land dat geen Engels spreekt, en op een venster zonder role="dialog".
// DE CODE VAN 09-09-2026, letterlijk zoals hij verscheept werd (versie 1.0.318).
// Tweede tegenproef: die faalde alleen op het cookiescherm, en dat is precies
// wat de verkoper meldde. Zonder deze functie ernaast bewijst de proef niet dat
// de reparatie van vandaag iets repareert.
async function _vorigVintedVerwijderen() {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const WEG = ["verwijderen", "supprimer", "löschen", "loschen", "delete",
               "eliminar", "elimina", "usuń", "usun", "ištrinti", "smazat"];
  const BEVESTIG = [
    "bevestigen en verwijderen", "ja, verwijderen",
    "confirmer et supprimer", "supprimer",
    "bestätigen und löschen", "bestatigen und loschen", "löschen", "loschen",
    "confirm and delete", "delete", "verwijderen",
    "confirmar y eliminar", "eliminar", "conferma ed elimina", "elimina",
    "ja", "yes", "oui",
  ];
  const ANNULEER = ["annuleren", "annuler", "abbrechen", "cancel", "cancelar",
                    "annulla", "terug", "back", "sluiten", "close", "nee", "no", "non"];
  const TITELS = ["artikel verwijderen", "advertentie verwijderen",
                  "supprimer l'article", "artikel löschen", "artikel loschen",
                  "delete item", "eliminar artículo", "elimina l'oggetto"];

  // ALLES WAT DEZE FUNCTIE GEBRUIKT MOET HIERBINNEN STAAN.
  //
  // Chrome injecteert alleen déze functie in de pagina; de rest van
  // background.js bestaat daar niet. Stond de hulpfunctie hieronder los, dan
  // gooide de pagina meteen een ReferenceError en kreeg de verkoper altijd
  // "Delete control not found" te zien, ongeacht wat er op het scherm stond.
  // Dat is op 30-08-2026 precies zo misgegaan. tests/test_vinted_verwijderknop.py
  // bewaakt dat er niets van buiten wordt aangeroepen.
  const tekst = e => (e.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
  const kaal = t => t.replace(/[?!.]+$/, "").trim();
  const zichtbaar = e => e.offsetParent !== null || e.getClientRects().length > 0;
  const knoppen = w => [...w.querySelectorAll('button, a, [role="menuitem"], [role="button"]')];
  const isWeg = e => WEG.includes(kaal(tekst(e))) || (e.dataset && e.dataset.testid || "").includes("delete");
  const schermbeeld = () => {
    const w = document.querySelector('[role="dialog"], [role="alertdialog"], [aria-modal="true"], '
                                     + '[data-testid*="modal"], .ReactModal__Content') || document;
    return knoppen(w).filter(zichtbaar).slice(0, 25)
      .map(e => tekst(e).slice(0, 30) + (e.dataset && e.dataset.testid ? `#${e.dataset.testid}` : ""))
      .filter(Boolean).join(" | ").slice(0, 400);
  };

  // 0) WACHTEN TOT DE PAGINA ER ECHT STAAT.
  //
  // Vinted bouwt de artikelpagina met JavaScript op. Kijken we te vroeg, dan is
  // er nog geen enkele knop en heet dat ten onrechte "Delete control not found".
  // Wachten tot er iets staat kost hooguit een paar seconden en scheelt een
  // mislukte verversing.
  for (let i = 0; i < 20; i++) {
    if (knoppen(document).some(zichtbaar)) break;
    await sleep(250);
  }

  // 1) De knop op de pagina zelf, eventueel achter het menu met de drie puntjes.
  let del = knoppen(document).find(e => zichtbaar(e) && isWeg(e));
  if (!del) {
    const menuknop = document.querySelector(
      '[data-testid="item-actions-button"], [data-testid="item-menu-button"], ' +
      '[data-testid="item-page-actions-dropdown-button"], [data-testid*="kebab"], ' +
      'button[aria-label*="more" i], button[aria-label*="actions" i], button[aria-label*="options" i]'
    );
    if (menuknop) {
      menuknop.click();
      await sleep(700);
      const menu = document.querySelector('[role="menu"], [role="listbox"], [data-testid*="dropdown"]') || document;
      del = knoppen(menu).find(isWeg) || knoppen(document).find(e => zichtbaar(e) && isWeg(e));
    }
  }
  if (!del) return { clickedDelete: false, opScherm: schermbeeld() };
  del.click();

  // 2) Wachten tot het bevestigingsvenster er echt staat. Herkenning op drie
  //    manieren, want Vinted wisselt van opmaak: de rol, of de titel uit hun
  //    eigen tekstenboek.
  let venster = null;
  for (let i = 0; i < 10 && !venster; i++) {
    await sleep(300);
    venster = document.querySelector('[role="dialog"], [role="alertdialog"], [aria-modal="true"], '
                                     + '[data-testid*="modal"], [data-testid*="dialog"], .ReactModal__Content');
    if (!venster) {
      const kop = [...document.querySelectorAll("h1,h2,h3,h4,[class*='title' i]")]
        .find(e => zichtbaar(e) && TITELS.includes(kaal(tekst(e))));
      if (kop) venster = kop.closest("div[class],section,form") || kop.parentElement;
    }
  }

  // 3) Bevestigen. NOOIT hetzelfde element nog een keer, en nooit "Annuleren".
  //    Zonder venster zoeken we in de hele pagina, maar dan van ACHTEREN naar
  //    voren: een venster wordt onderaan de body gehangen, de knop van de
  //    pagina staat erboven.
  const kandidaten = knoppen(venster || document)
    .filter(e => e !== del && zichtbaar(e) && !e.disabled)
    .filter(e => { const t = kaal(tekst(e)); return t && !ANNULEER.includes(t) && BEVESTIG.includes(t); });
  const bevestig = venster ? kandidaten[0] : kandidaten[kandidaten.length - 1];
  if (!bevestig) return { clickedDelete: true, clickedConfirm: false, venster: !!venster,
                          opScherm: schermbeeld() };
  bevestig.click();
  await sleep(1200);
  return { clickedDelete: true, clickedConfirm: true, venster: !!venster,
           bevestigd: kaal(tekst(bevestig)) };
}


async function _oudVintedVerwijderen() {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let del = [...document.querySelectorAll('button, a, [role="menuitem"], [role="button"]')]
    .find(e => e.offsetParent !== null && (/^\s*delete\s*$/i.test(e.textContent) || e.dataset.testid?.includes("delete")));
  if (!del) {
    const actions = document.querySelector('[data-testid="item-actions-button"], [data-testid*="kebab"]');
    if (actions) {
      actions.click();
      await sleep(300);
      const menu = document.querySelector('[role="menu"], [role="listbox"], [data-testid*="dropdown"]') || document;
      del = [...menu.querySelectorAll('button, a, [role="menuitem"]')]
        .find(e => /^\s*delete\s*$/i.test(e.textContent) || e.dataset.testid?.includes("delete"));
    }
  }
  if (!del) return { clickedDelete: false };
  del.click();
  await sleep(400);
  const scope = document.querySelector('[role="dialog"], [role="alertdialog"], [data-testid*="modal"], .ReactModal__Content') || document;
  const bevestig = [...scope.querySelectorAll('button, a[role="button"]')]
    .find(el => {
      const t = el.textContent.trim();
      if (/annuleer|cancel|terug|back/i.test(t)) return false;
      return /confirm|delete|verwijder|remove|\byes\b|\bja\b/i.test(t) || el.dataset.testid?.includes("delete");
    });
  if (!bevestig) return { clickedDelete: true, clickedConfirm: false };
  bevestig.click();
  await sleep(300);
  return { clickedDelete: true, clickedConfirm: true };
}

async function draai(routine) {
  const regels = [];
  let stuk = 0;
  for (const geval of GEVALLEN) {
    const telling = bouw(geval);
    let uit;
    try { uit = await routine(); }
    catch (e) { uit = { fout: String(e) }; }
    // GOED = het artikel is echt weg: precies één klik op de bevestiging in het
    // venster, en niet op annuleren.
    const goed = telling.bevestig === 1 && telling.annuleer === 0 && uit.clickedConfirm === true;
    if (!goed) stuk++;
    regels.push(`${goed ? "  ok  " : " FOUT "} ${geval.naam.padEnd(30)} `
      + `bevestigd=${JSON.stringify(uit.bevestigd || null)} `
      + `klikken(pagina/ja/annuleer)=${telling.pagina}/${telling.bevestig}/${telling.annuleer}`
      + (uit.clickedDelete === false ? "  ← knop niet eens gevonden" : ""));
  }
  document.querySelectorAll(".venster").forEach(v => v.remove());
  return { stuk, regels };
}

(async () => {
  const nieuwe = await draai(_mwVintedVerwijderen);
  const vorige = await draai(_vorigVintedVerwijderen);
  const oude = await draai(_oudVintedVerwijderen);
  const el = document.getElementById("uitslag");
  el.textContent =
    "NU (extension/background.js)\n" + nieuwe.regels.join("\n")
    + `\n  → ${nieuwe.stuk === 0 ? "alle " + GEVALLEN.length + " goed" : nieuwe.stuk + " stuk"}\n\n`
    + "TER VERGELIJKING — de code van 09-09-2026 (versie 1.0.318)\n" + vorige.regels.join("\n")
    + `\n  → ${vorige.stuk} van de ${GEVALLEN.length} stuk\n\n`
    + "TER VERGELIJKING — de code van vóór 30-08-2026\n" + oude.regels.join("\n")
    + `\n  → ${oude.stuk} van de ${GEVALLEN.length} stuk\n\n`
    + (nieuwe.stuk === 0 && oude.stuk > 0
        ? "ALLES GOED — en de oude code faalt aantoonbaar op dezelfde schermen"
        : "LET OP: deze proef toont niets aan");
  el.className = (nieuwe.stuk === 0 && oude.stuk > 0) ? "goed" : "fout";
  window.__uitslag = { nieuw: nieuwe.stuk, vorig: vorige.stuk, oud: oude.stuk,
                      gevallen: GEVALLEN.length,
                      regelsNieuw: nieuwe.regels, regelsVorig: vorige.regels };
})();
</script>
