<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/i18n.js?v=7e469d0d5d"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — Omnivaleur</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preload" href="/assets/site/fonts/clash-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/site/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site/site.css?v=6">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VJ5BVD3GCH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-VJ5BVD3GCH');
</script>
</head>
<body class="on-field auth-page">

<a class="auth-logo" href="/"><img src="/assets/site/mark.png" alt="" width="52" height="28"><span>Omnivaleur</span></a>

<main class="auth-card">
  <h1>New password</h1>
  <p class="subtitle">Choose a new password for your account.</p>

  <div id="error" class="error"></div>
  <div id="success" class="success">Password updated!<br>You can now log in with your new password.</div>

  <form id="form" onsubmit="doUpdate(event)">
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" autofocus autocomplete="new-password">
    </div>
    <div class="field">
      <label for="password2">Confirm password</label>
      <input type="password" id="password2" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary" id="btn">Save password</button>
  </form>

  <div class="links auth-links">
    <a href="/login">Back to login</a>
  </div>
</main>

<div data-taalkeuze class="auth-lang"></div>

<script>
const API = window.location.hostname === 'localhost' ? 'http://localhost:8001' : '';

function parseHash() {
  const hash = window.location.hash.slice(1);
  return Object.fromEntries(hash.split('&').map(p => p.split('=')));
}

const params = parseHash();
const accessToken = params.access_token;
const refreshToken = params.refresh_token;

if (!accessToken || params.type !== 'recovery') {
  document.getElementById('error').textContent = 'Invalid or expired reset link. Please request a new one.';
  document.getElementById('error').style.display = 'block';
  document.getElementById('form').style.display = 'none';
}

async function doUpdate(e) {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const btn = document.getElementById('btn');
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';

  if (password.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    errEl.style.display = 'block';
    return;
  }
  if (password !== password2) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch(`${API}/api/auth/reset-password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${accessToken}`
      },
      body: JSON.stringify({ password, refresh_token: refreshToken })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Something went wrong. Please try again.');
    document.getElementById('form').style.display = 'none';
    document.getElementById('success').style.display = 'block';
    setTimeout(() => { window.location.href = '/login.html'; }, 3000);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Save password';
  }
}
</script>

</body>
</html>
