<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/i18n.js?v=a968cb9cf0"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting eBay — Omnivaleur</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preload" href="/assets/site/fonts/clash-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/site/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site/site.css?v=6">
</head>
<body class="on-field auth-page">

<a class="auth-logo" href="/"><img src="/assets/site/mark.png" alt="" width="52" height="28"><span>Omnivaleur</span></a>

<main class="auth-card" id="card">
  <div class="spinner"></div>
  <h1>Connecting your eBay account…</h1>
  <p>Hold on, this only takes a second.</p>
</main>

<script>
const API = window.location.hostname === 'localhost' ? 'http://localhost:8001' : '';
// ── HET INLOGBEWIJS OVERLEEFT HET TABBLAD (08-09-2026) ───────────────────────
//
// Stond in sessionStorage. Dat is per tabblad: een tweede tabblad opende op de
// inlogpagina, en zodra Chrome dichtging was je uitgelogd. Voor een dienst waar
// je de computer juist áán laat staan met de extensie erop is dat elke dag
// opnieuw inloggen. beheer.html gebruikte al localStorage, met precies deze
// uitleg erbij; het klantendashboard was daar simpelweg nooit langs gegaan.
//
// Lezen kijkt ook nog in sessionStorage, zodat wie op dit moment is ingelogd
// niet door deze wijziging wordt uitgelogd.
const SESSIE = {
  lees(sleutel) {
    try { const v = localStorage.getItem(sleutel); if (v !== null) return v; } catch (e) {}
    try { return sessionStorage.getItem(sleutel); } catch (e) { return null; }
  },
  zet(sleutel, waarde) {
    try { localStorage.setItem(sleutel, waarde); } catch (e) {
      try { sessionStorage.setItem(sleutel, waarde); } catch (e2) {}
    }
  },
  wis(sleutel) {
    try { localStorage.removeItem(sleutel); } catch (e) {}
    try { sessionStorage.removeItem(sleutel); } catch (e) {}
  },
  wisAlles() {
    ['cl_auth', 'cl_token', 'cl_refresh', 'cl_email'].forEach((s) => this.wis(s));
  },
};

const TOKEN = SESSIE.lees('cl_token') || '';

function render(icon, title, sub, showBtn) {
  document.getElementById('card').innerHTML = `
    <div class="icon">${icon}</div>
    <h1>${title}</h1>
    <p>${sub}</p>
    ${showBtn ? '<a href="/app.html#platforms" class="btn btn-primary">Back to dashboard</a>' : ''}
  `;
}

(async function () {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error') || params.get('error_description');

  if (!TOKEN) {
    render('🔒', 'Please log in first', 'Your session expired — log in to Omnivaleur, then try connecting eBay again.', true);
    return;
  }
  if (error) {
    render('!', 'eBay authorization was cancelled', error, true);
    return;
  }
  if (!code) {
    render('!', 'Something went wrong', 'No authorization code was received from eBay. Please try again.', true);
    return;
  }

  try {
    const res = await fetch(`${API}/api/platforms/ebay/callback?code=${encodeURIComponent(code)}`, {
      headers: { 'Authorization': `Bearer ${TOKEN}` },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      render('!', 'Could not connect eBay', err.detail || 'Please try again from the Platforms page.', true);
      return;
    }
    render('✓', 'eBay connected!', 'You can now publish items directly to eBay from Omnivaleur.', false);
    setTimeout(() => { window.location.href = '/app.html#platforms'; }, 1800);
  } catch (e) {
    render('!', 'Could not connect eBay', String(e.message || e), true);
  }
})();
</script>
</body>
</html>
