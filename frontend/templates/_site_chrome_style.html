<style id="site-chrome">
/* Kopregel en voettekst van de openbare site. Alles hangt onder .site-nav of
   .site-footer, zodat het wint van wat een pagina zelf nog over nav of footer
   zegt en niets anders op die pagina raakt. */
.site-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5;box-sizing:border-box}
.site-nav *{box-sizing:border-box}
.site-nav a:hover{text-decoration:none}
.site-nav .nav-logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.4px;text-decoration:none;color:#0f172a}
.site-nav .nav-logo img{height:32px;width:auto}
.site-nav .grad-text{background:linear-gradient(135deg,#2563eb,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.site-nav .nav-links{display:flex;gap:24px;align-items:center;margin:0;padding:0}
.site-nav .nav-links a{font-size:14px;font-weight:500;color:#64748b;text-decoration:none;transition:color .15s}
.site-nav .nav-links a:hover,.site-nav .nav-links a.active{color:#0f172a}
.site-nav .nav-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}
.site-nav .site-lang{display:inline-flex;align-items:center;border:1px solid #e2e8f0;border-radius:100px;overflow:hidden;font-size:12px;font-weight:700;line-height:1}
.site-nav .site-lang a,.site-nav .site-lang span{padding:6px 11px;color:#64748b;text-decoration:none}
.site-nav .site-lang a:hover{color:#0f172a;background:rgba(0,0,0,.04)}
.site-nav .site-lang .on{background:linear-gradient(135deg,#2563eb,#34d399);color:#fff}
.site-nav .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;white-space:nowrap;text-decoration:none}
.site-nav .btn-outline{background:transparent;border:1.5px solid #e2e8f0;color:#0f172a}
.site-nav .btn-outline:hover{border-color:#2563eb;color:#2563eb}
.site-nav .btn-primary{background:linear-gradient(135deg,#2563eb,#34d399);color:#fff;box-shadow:0 2px 12px rgba(37,99,235,.25)}
.site-nav .btn-primary:hover{box-shadow:0 4px 20px rgba(37,99,235,.4);transform:translateY(-1px)}
.site-nav .nav-toggle-cb{display:none}
.site-nav .nav-hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:30px;height:30px;cursor:pointer;margin-left:auto}
.site-nav .nav-hamburger span{display:block;height:2px;width:22px;background:#0f172a;border-radius:2px;transition:.2s}
.site-nav .nav-toggle-cb:checked ~ .nav-hamburger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.site-nav .nav-toggle-cb:checked ~ .nav-hamburger span:nth-child(2){opacity:0}
.site-nav .nav-toggle-cb:checked ~ .nav-hamburger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.site-nav .nav-panel{display:contents}
@media(max-width:900px){.site-nav .nav-links{gap:16px}.site-nav .nav-links a{font-size:13px}}
@media(max-width:700px){
  .site-nav .nav-hamburger{display:flex}
  .site-nav .nav-panel{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:rgba(255,255,255,.98);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;box-shadow:0 8px 24px rgba(15,23,42,.08)}
  .site-nav .nav-toggle-cb:checked ~ .nav-panel{display:flex}
  .site-nav .nav-links{flex-direction:column;gap:0;align-items:stretch;padding:6px 0}
  .site-nav .nav-links a{padding:13px 24px;font-size:15px}
  .site-nav .nav-links a:hover{background:rgba(0,0,0,.03)}
  .site-nav .nav-actions{flex-direction:column;align-items:stretch;gap:10px;padding:16px 24px;border-top:1px solid #e2e8f0}
  .site-nav .nav-actions .btn{width:100%;justify-content:center}
  .site-nav .site-lang{align-self:center;margin-bottom:4px}
}

.site-footer{background:#0f172a;color:rgba(255,255,255,.55);font-size:13px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;text-align:left;flex-shrink:0;margin:0;padding:0;border:0}
.site-footer *{box-sizing:border-box}
.site-footer a,.site-footer a:hover{text-decoration:none;font-weight:inherit;transition:color .15s}
.site-footer .footer-main{max-width:1200px;margin:0 auto;padding:64px 40px 48px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px}
.site-footer .footer-logo{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:#fff}
.site-footer .footer-logo img{height:32px;width:auto}
.site-footer .footer-logo span{background:linear-gradient(135deg,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.site-footer .footer-brand p{font-size:13px;line-height:1.7;margin:16px 0 0;color:rgba(255,255,255,.45);max-width:280px}
.site-footer .footer-brand p + p{margin-top:4px}
.site-footer .footer-brand p a{color:rgba(255,255,255,.55)}
.site-footer .footer-brand p a:hover{color:#fff}
.site-footer .footer-col h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35);margin:0 0 16px;padding:0}
.site-footer .footer-col ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin:0;padding:0}
.site-footer .footer-col ul li{margin:0;padding:0}
.site-footer .footer-col ul li a{color:rgba(255,255,255,.6);font-size:14px}
.site-footer .footer-col ul li a:hover{color:#fff}
.site-footer .footer-social{border-top:1px solid rgba(255,255,255,.08);padding:16px 40px 0;max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.site-footer .footer-social span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.site-footer .footer-social a{color:rgba(255,255,255,.6);font-size:13px}
.site-footer .footer-social a:hover{color:#fff}
.site-footer .footer-bottom{border-top:1px solid rgba(255,255,255,.08);padding:20px 40px;display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:16px auto 0;flex-wrap:wrap;gap:8px;font-size:12px;color:rgba(255,255,255,.35)}
.site-footer .footer-bottom-links{display:flex;gap:20px}
.site-footer .footer-bottom-links a{color:rgba(255,255,255,.4);font-size:12px}
.site-footer .footer-bottom-links a:hover{color:#fff}
@media(max-width:900px){
  .site-footer .footer-main{grid-template-columns:1fr 1fr;gap:32px;padding:48px 20px 32px}
  .site-footer .footer-brand{grid-column:1 / -1}
  .site-footer .footer-social{padding:16px 20px 0}
  .site-footer .footer-bottom{padding:16px 20px;flex-direction:column;align-items:flex-start}
}
@media(max-width:420px){.site-footer .footer-main{grid-template-columns:1fr}}
</style>
