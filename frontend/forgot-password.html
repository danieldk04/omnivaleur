<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/i18n.js?v=b381aa6dfa"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — Omnivaleur</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preload" href="/assets/site/fonts/clash-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/site/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site/site.css?v=6">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VJ5BVD3GCH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-VJ5BVD3GCH');
</script>
</head>
<body class="on-field auth-page">

<a class="auth-logo" href="/"><img src="/assets/site/mark.png" alt="" width="52" height="28"><span>Omnivaleur</span></a>

<main class="auth-card">
  <h1>Forgot password</h1>
  <p class="subtitle">Enter your email address. If it's registered, we'll send you a reset link.</p>

  <div id="error" class="error"></div>
  <div id="success" class="success">Reset link sent!<br>Check your inbox (and spam folder).</div>

  <form id="form" onsubmit="doReset(event)">
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="name@example.com" autofocus autocomplete="email">
    </div>
    <button type="submit" class="btn btn-primary" id="btn">Send reset link</button>
  </form>

  <div class="links auth-links">
    <a href="/login">Back to login</a>
  </div>
</main>

<div data-taalkeuze class="auth-lang"></div>

<script>
const API = window.location.hostname === 'localhost' ? 'http://localhost:8001' : '';

async function doReset(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn');
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Sending...';
  try {
    const res = await fetch(`${API}/api/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || 'Something went wrong. Please try again.');
    }
    document.getElementById('form').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  }
}
</script>

</body>
</html>
