<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Omnivaleur</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="/logo.png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--blue:#2563eb;--mint:#34d399;--blue-dark:#1d4ed8;--border:#e2e8f0;--text:#0f172a;--muted:#64748b}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);background:#fff;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
  a{text-decoration:none}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:34px;font-weight:800;font-size:20px}
  .logo img{width:32px;height:32px}
  .grad-text{background:linear-gradient(135deg,var(--blue),var(--mint));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .code{font-size:64px;font-weight:800;line-height:1;margin-bottom:14px}
  h1{font-size:1.6rem;margin-bottom:12px}
  p{color:var(--muted);max-width:520px;line-height:1.65;margin-bottom:28px}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{padding:11px 22px;border-radius:10px;font-weight:600;font-size:15px;border:1.5px solid var(--border);color:var(--text)}
  .btn-primary{background:linear-gradient(135deg,var(--blue),var(--mint));color:#fff;border-color:transparent}
  .btn:hover{border-color:#cbd5e1}
  .btn-primary:hover{opacity:.92}
</style>
</head>
<body>
  <a class="logo" href="/"><img src="/logo.png" alt=""><span class="grad-text">Omnivaleur</span></a>
  <div class="code grad-text">404</div>
  <h1>This page doesn't exist</h1>
  <p>The link may be outdated or mistyped. Everything else is still here — start from the homepage, or browse the cross-listing guides.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">Go to homepage</a>
    <a class="btn" href="/blog">Read the guides</a>
    <a class="btn" href="/marketplaces">Supported marketplaces</a>
  </div>
</body>
</html>
