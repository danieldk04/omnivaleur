# Vertaaltest: elke wijziging aan tekst die een klant ziet moet ook in het
# Nederlands bestaan (frontend/i18n/nl.json). Daniel, 24-09-2026: "als je iets
# wijzigt, ALTIJD in Nederlands en Engels".
#
# Waarom hier: de regel staat in CLAUDE.md, maar een sessie of ontwikkelaar die
# hem mist merkt het anders pas als een klant een Engelse zin ziet. Deze proef
# draait bij elke pull request en elke push naar main, en kleurt rood zodra er
# een nieuwe Engelse zin zonder vertaling bijkomt of de ?v= in de pagina's niet
# klopt. Alleen de standaardbibliotheek plus pytest; geen sleutels nodig.
#
# Rood? Draai lokaal:
#   python3 scripts/i18n_extract.py            # wat mist er
#   (vertaling in frontend/i18n/nl.json zetten)
#   python3 scripts/i18n_extract.py --versie

name: Vertaaltest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  nl-compleet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_i18n_compleet.py
