name: Programmatic content generation

on:
  schedule:
    - cron: '0 8 * * *'  # 09:00/10:00 CET dagelijks
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen research + generatie loggen, niets publiceren'
        type: boolean
        default: false
      all:
        description: 'Alle pending keywords verwerken i.p.v. er 1'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements-content.txt

      # backend/content/hero.py tekent de hero-afbeelding met een TrueType-font.
      # ubuntu-latest heeft DejaVu meestal al, maar expliciet installeren is
      # goedkoop en voorkomt dat een runner-image-wijziging stilletjes elk nieuw
      # artikel zonder hero laat publiceren.
      - name: Install fonts for hero image generation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Run content pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python3 scripts/generate_content.py ${{ github.event.inputs.all == 'true' && '--all' || '' }}

      # De publicatienorm staat in backend/content/quality.py en wordt bij elke
      # publicatie toegepast — maar een norm die niemand nameet zakt vanzelf weg.
      # Dit zet na elke run op een rij hoeveel artikelen 'm halen, zodat een
      # terugval binnen een dag zichtbaar is in de Actions-log. Bewust zonder
      # --strict: een artikel dat op één punt zakt mag de cron niet laten omvallen.
      - name: Check blog quality standard
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/check_blog_quality.py

      - name: Commit updated keyword queue and generated hero images
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          # De hero-afbeelding van een nieuw artikel wordt tijdens deze run op
          # schijf gezet. Zonder dit `git add` gooit de `git checkout -- .`
          # hieronder hem weg en verwijst het verse artikel naar een 404.
          git add scripts/content_keywords.json frontend/assets/blog/hero
          git diff --staged --quiet && exit 0
          git commit -m "auto: update content keyword queue + hero images"
          # Anything else left dirty by the pipeline run (caches, logs) would block
          # the rebase below — it's not meant to be committed here, so drop it.
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed (concurrent push to main) — retrying after rebase..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::Could not push keyword queue update after 5 attempts"
          exit 1
