name: diag-woo
on:
  push:
    branches: [diag-woo-dejuistetoon]
permissions:
  id-token: write
  contents: read
jobs:
  meet:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=omnivaleur-bronfotos" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "BEWIJS $T"
