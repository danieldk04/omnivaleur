name: diag-woo
on:
  push:
    branches: [diag-woo-dejuistetoon]
jobs:
  meet:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 20); do
            c=$(curl -s -m 20 https://omnivaleur.com/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit'))" 2>/dev/null)
            echo "$(date -u +%T) commit=$c"
            case "$c" in b620b12*|3d350b7*) echo LIVE; exit 0;; esac
            sleep 30
          done
          exit 1
