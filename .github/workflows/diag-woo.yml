name: diag-woo
on:
  push:
    branches: [diag-woo-dejuistetoon]
permissions:
  id-token: write
  contents: read
jobs:
  meet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: toon-bronfotos }
      - run: |
          pip install -q "python-jose[cryptography]==3.3.0" httpx
          python3 - <<'PY'
          import asyncio, json, os, urllib.request
          from backend.services import github_oidc as o
          req = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=omnivaleur-bronfotos",
                                       headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          t = json.load(urllib.request.urlopen(req))["value"]
          for publiek, wf in (("omnivaleur-bronfotos", "diag-woo.yml"), ("ander", "diag-woo.yml")):
              try: print("UITKOMST", publiek, "ok", asyncio.run(o.controleer(t, publiek, wf)))
              except o.Geweigerd as e: print("UITKOMST", publiek, "geweigerd:", str(e)[:120])
          PY
