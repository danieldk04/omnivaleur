name: diag-woo
on:
  push:
    branches: [diag-woo-dejuistetoon]
jobs:
  meet:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://dejuistetoon.eu/wp-json/wc/v3/products "https://dejuistetoon.eu/?rest_route=/wc/v3/products"; do
          echo "######## OPTIONS $u"
          curl -sS -m 20 -X OPTIONS -D - -o /dev/null -H "Origin: https://omnivaleur.com" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization" "$u" | grep -i -E "^HTTP|^access-control|^sg-captcha|^vary"
          echo "######## GET $u (Origin, Basic met onzin-sleutel)"
          curl -sS -m 20 -D - -o b.txt -H "Origin: https://omnivaleur.com" -u "ck_test:cs_test" "$u" | grep -i -E "^HTTP|^access-control|^sg-captcha"
          head -c 200 b.txt; echo
          done
