# De trendmotor: elke dinsdagochtend meten wat er in de niche werkt en Daniel
# vertellen wat hij moet maken.
#
# Waarom hier en niet op Railway: de meting heeft een echte browser nodig, want
# TikTok geeft zijn cijfers alleen aan een browser prijs. Railway draait op
# Nixpacks zonder Chromium; daar een browser in bouwen zet de bouw van de live
# website op het spel voor een taak die er niets mee te maken heeft. Hier staat
# de browser standaard klaar en raakt een mislukte meting de site niet.
#
# De dubbele cron is geen fout. GitHub roostert alleen in UTC en Nederland
# schuift twee keer per jaar een uur op. Beide beurten starten, maar het script
# controleert zelf de Nederlandse klok en stopt meteen als het niet 08:xx is.
# Zo klopt de tijd het hele jaar zonder dat iemand het rooster hoeft te verzetten.

name: Trendmotor

on:
  schedule:
    - cron: "30 6 * * 2"    # dinsdag 08:30 Nederlandse zomertijd
    - cron: "30 7 * * 2"    # dinsdag 08:30 Nederlandse wintertijd
  workflow_dispatch:        # met de hand starten vanaf github.com
    inputs:
      echt_versturen:
        description: "Ook echt mailen en in Notion zetten (anders alleen een proefronde)"
        type: boolean
        default: false

concurrency:
  group: trendmotor
  cancel-in-progress: false

jobs:
  meten:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Amsterdam
      MAIL_HOST: smtp.zoho.eu
      MAIL_USER: daniel@omnivaleur.nl
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optioneel. Zonder deze sleutel meet YouTube alleen views, datum en duur;
      # mét sleutel ook likes en reacties, en telt YouTube dus echt mee in de
      # engagement-vergelijking in plaats van als bijvangst.
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
    permissions:
      contents: write        # nodig om het opgebouwde archief terug te schrijven
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Benodigdheden
        run: |
          pip install --quiet playwright httpx pillow anthropic
          python -m playwright install --with-deps chromium

      # Op het rooster: alleen doorgaan als het in Nederland echt 08:xx is, en
      # dan ook echt versturen. Met de hand gestart: geen klokcontrole (anders
      # kun je nooit testen) en niet versturen, zodat een test nooit per ongeluk
      # een halve mail de deur uit doet.
      - name: Meten en versturen (rooster)
        if: github.event_name == 'schedule'
        run: python3 scripts/social_trends_rapport.py --alleen-uur 8

      - name: Proefronde zonder versturen (met de hand gestart)
        if: github.event_name == 'workflow_dispatch' && inputs.echt_versturen != true
        run: python3 scripts/social_trends_rapport.py --droog

      - name: Echte ronde (met de hand gestart)
        if: github.event_name == 'workflow_dispatch' && inputs.echt_versturen == true
        run: python3 scripts/social_trends_rapport.py

      # Het archief terugschrijven naar de repo. Dit is wat de meting van een
      # ochtendvangst een groeiend bewijsdossier maakt: volgende week telt deze
      # 1.400 video's mee, de week daarna 2.800. Zonder deze stap begint elke
      # dinsdag weer bij nul en blijven "30 dagen" en "90 dagen" holle woorden.
      - name: Archief bewaren in de repo
        if: github.event_name == 'schedule' || inputs.echt_versturen == true
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "trendmotor"
            git config user.email "daniel@omnivaleur.nl"
            git add data/trends-archief.json.gz
            git commit -m "trendmotor: meting van $(date +%d-%m-%Y) toegevoegd aan het archief"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          else
            echo "geen wijziging in het archief"
          fi

      # De meting van deze week bewaren. Dat is niet alleen archief: de laag van
      # 90 dagen wordt pas betrouwbaar als er weken achter elkaar gemeten is, en
      # zonder dit zou elke ronde weer bij nul beginnen.
      - name: Meting bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meting-${{ github.run_number }}
          path: scripts/output/trends-*.json
          retention-days: 90
          if-no-files-found: ignore
