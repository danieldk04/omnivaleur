# De koude-mailmachine, draaiend bij GitHub in plaats van op Daniels Mac.
#
# Waarom hier: op de Mac stopt alles zodra hij dichtklapt. GitHub Actions draait
# altijd, kost bij een publieke repo niets, en mag wel uitgaande mail versturen
# (Railway mag dat niet).
#
# De leadlijst en de administratie staan NIET in deze repo — die is publiek. Ze
# staan in Supabase, tabel leadgen_opslag. Wachtwoorden staan in de Secrets van
# de repo (Settings → Secrets and variables → Actions).
#
# Elke beurt kijkt het script zelf of er iemand aan de beurt is; meestal doet hij
# niets en is de beurt binnen twintig seconden klaar.

name: Leadmachine

on:
  schedule:
    # Elke 30 minuten tussen 08:00 en 21:30 Nederlandse tijd (UTC+2).
    - cron: "*/30 6-19 * * *"
  workflow_dispatch:      # met de hand kunnen starten vanaf github.com

concurrency:
  # Nooit twee beurten tegelijk: dan zou dezelfde lead twee mails krijgen.
  group: leadmachine
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # Was 30: de slimme, op-maat-geschreven concepten (Anthropic-aanroepen)
    # kosten meer tijd dan het oude sjabloon-alleen-pad, en braken de laatste
    # van de 3 rondes twee keer af nog voor hij klaar was — ontdekt 26-08-2026.
    timeout-minutes: 55
    env:
      TZ: Europe/Amsterdam       # zonder dit rekent de server in UTC en loopt het rooster twee uur voor
      MAIL_HOST: smtp.zoho.eu
      IMAP_HOST: imap.zoho.eu
      MAIL_USER: daniel@omnivaleur.nl
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Zonder deze staat de sleutel wel in de repo-secrets maar komt hij nooit
      # bij het script terecht — elk "slim concept" (_slim_concept, _stilte_concept)
      # viel daardoor altijd stil terug op het vaste sjabloon, ook al leek de code
      # zelf in orde. Ontdekt 26-08-2026 bij het bouwen van de stille-opvolging.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # anthropic erbij: zonder dit pakket crasht elke poging tot een slim,
      # op maat geschreven concept (_slim_concept, _stilte_concept) stil op een
      # ImportError en valt alles terug op het kale vaste sjabloon — ontdekt
      # 26-08-2026 toen een "stille opvolging" niets van het eerdere gesprek
      # bleek te bevatten, ook al stond ANTHROPIC_API_KEY inmiddels wel goed.
      - run: pip install --quiet httpx anthropic
      # Drie controles per beurt, zeven minuten uit elkaar.
      #
      # GitHub belooft geen stipte kloktijden: normaal draait dit 25 keer per dag,
      # maar op 18-08-2026 ging er tussen 08:20 en 09:10 geen enkele ronde en bleven
      # nieuwe reacties liggen. Een cron die je niet in de hand hebt, moet je niet
      # je enige hartslag maken. Slaat GitHub een beurt over, dan zijn er binnen
      # deze beurt nog steeds drie momenten geweest waarop de postbus is gelezen.
      # Let op de vorm van de pauze. Dit stond er als
      #   [ $i -lt 3 ] && sleep 420
      # en die test geeft bij de LAATSTE ronde netjes "onwaar" terug — wat in bash
      # exitcode 1 is. Omdat het de laatste opdracht van de stap is, viel de hele
      # beurt daarop om, elke halve beurt van 18-08-2026, terwijl het mailwerk zelf
      # gewoon gelukt was. Een if-blok geeft die 1 niet door.
      - run: |
          for i in 1 2 3; do
            python scripts/leadgen_mail.py tick || true
            if [ "$i" -lt 3 ]; then sleep 420; fi
          done
